  function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
  var raw = b64(PAYLOAD);
  var salt = raw.slice(0,16), iv = raw.slice(16,28), body = raw.slice(28);
  var form = document.getElementById('form'), err = document.getElementById('err');
  form.addEventListener('submit', async function(e){
    e.preventDefault();
    err.textContent='';
    var pw = document.getElementById('pw').value;
    try{
      var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey(
        {name:'PBKDF2', salt:salt, iterations:200000, hash:'SHA-256'},
        km, {name:'AES-GCM', length:256}, false, ['decrypt']);
      var buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, key, body);
      var html = new TextDecoder().decode(buf);
      // Replace the whole page with the decrypted document so its inline
      // scripts (table rendering, tab switching, print) run natively.
      document.open();
      document.write(html);
      document.close();
    }catch(ex){
      err.textContent = '合言葉が違います。もう一度お試しください。';
    }
  });
